<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{% endblock %} - Plataforma Parkinson</title>

    <!-- Bootstrap -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/all.min.css') }}">

    <!-- Estilos globales -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">

    <!-- Estilos específicos por página -->
    {% block extra_css %}{% endblock %}
</head>

<body class="d-flex flex-column min-vh-100">

    <!-- Contenido dinámico (cada página incluye su nav + footer si quiere) -->
    <div class="flex-grow-1">
        {% block content %}{% endblock %}
    </div>

    <!-- Footer -->
    {% include 'footer.html' %}

    <!-- Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Chart.js global (solo se carga una vez) -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

    <!-- Firebase SDK global -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js";
        import { getFirestore } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-firestore.js";
        import { getAuth } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js";
        import { getDatabase } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDodFRp_ojAx0XgQKc03VxXsmRF-QBitZw",
            authDomain: "watchy-e7e51.firebaseapp.com",
            databaseURL: "https://watchy-e7e51-default-rtdb.firebaseio.com",
            projectId: "watchy-e7e51",
            storageBucket: "watchy-e7e51.appspot.com",
            messagingSenderId: "1019655860469",
            appId: "1:1019655860469:web:fb73c8a2d4d7352e34d5bc",
            measurementId: "G-20PRNZM7VD"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const rtdb = getDatabase(app);
        const auth = getAuth(app);

        window._db = db;
        window._rtdb = rtdb;
        window._auth = auth;

        console.log("🔥 Firebase inicializado correctamente");
    </script>

    <!-- Config del dispositivo Watchy, inyectada desde variables de entorno del servidor -->
    <script>
        window.__WATCHY_DEVICE__ = {
            email: {{ firebase_device_auth_email | tojson }},
            pass: {{ firebase_device_auth_password | tojson }},
            userId: {{ firebase_user_id | tojson }},
            deviceId: {{ firebase_device_id | tojson }}
        };
    </script>

    <!-- Scripts específicos por página -->
    {% block extra_js %}{% endblock %}

</body>

</html>
